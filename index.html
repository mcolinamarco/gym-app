<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#262624">
<title>Gym App</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:dark;--bg:#262624;--ink:#E8E6DC;--mute:#A6A39A;--line:#3B3A36;--panel:#2E2D2A;--or:#D97757}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:22px;font-weight:500;margin:0 0 4px}
.sub{color:var(--mute);font-size:14px;margin:0 0 22px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a.card{display:flex;align-items:center;gap:14px;min-height:64px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none}
a.card:hover{border-color:#5a5852}
a.card:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.dot{flex:0 0 10px;height:10px;border-radius:50%;background:var(--or)}
.txt{flex:1}
.name{font-size:16px}
.style{font-size:13px;color:var(--mute)}
.go{color:var(--mute);font-size:18px}
</style>
</head>
<body>
<main>
  <h1>Exercises</h1>
  <p class="sub">Strength work for runners. Tap one to see it in 3D.</p>
  <ul id="list"></ul>
</main>
<script type="module">
import { EXERCISES } from './src/exercises/index.js';
const ul = document.getElementById('list');
for (const e of EXERCISES) {
  const li = document.createElement('li');
  const a = document.createElement('a'); a.className = 'card'; a.href = 'exercise.html?ex=' + e.id;
  a.innerHTML = '<span class="dot"></span><span class="txt"><div class="name"></div><div class="style"></div></span><span class="go">›</span>';
  a.querySelector('.name').textContent = e.name; a.querySelector('.style').textContent = e.style;
  li.append(a); ul.append(li);
}
</script>
</body>
</html>
